<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - DataSync Pro</title>
    <!-- Link the main style sheet and sign-in style sheet -->
    <link rel="stylesheet" href="./assets/style/style.css" />
    <link rel="stylesheet" href="./assets/style/signinstyle.css" />
  </head>
  <body>
    <!-- Mobile top navigation bar, shown only on screen sizes <= 768px -->
    <header class="mobile-header">
      <button class="menu-toggle-btn" aria-label="Toggle Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="mobile-logo">DataSync Pro</div>
      <div class="mobile-header-icons">
        <div class="notification-wrapper">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span class="badge"></span>
        </div>
      </div>
    </header>

    <div class="signin-container">
      <!-- Left side: Hero office workspace banner image -->
      <div class="signin-hero">
        <img src="./assets/images/recent_referrals.jpg" alt="Office Workspace" />
      </div>

      <!-- Right side: Dark sign-in form container -->
      <div class="signin-form-area">
        <div class="signin-form-wrapper">
          <h1 class="signin-title">Sign In</h1>
          <form action="./index.html" class="signin-form">
            <div class="input-group">
              <label for="Email">Email</label>
              <input type="email" id="Email" name="Email" placeholder="Email address" required />
            </div>
            
            <div class="input-group">
              <label for="Password">Password</label>
              <input type="password" id="Password" name="Password" placeholder="Password" required />
            </div>

            <div class="remember-me-container">
              <label class="switch">
                <input type="checkbox" id="remember-me" name="remember-me" />
                <span class="slider"></span>
              </label>
              <label for="remember-me" class="remember-me-label">Remember me</label>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>

            <div class="form-links">
              <a href="#" class="forgot-password-link">Forgot password?</a>
              <p class="signup-redirect">
                Don't have an account? <a href="./signup.html">Sign Up</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
